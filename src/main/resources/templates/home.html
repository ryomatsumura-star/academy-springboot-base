<!DOCTYPE html>
<html lang="ja"
      xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="UTF-8">
  <title>ホーム</title>
  <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>

  <div th:replace="~{fragments/header :: header}"></div>

  <main class="home-main">
    <section class="profile">
      <div class="profile-user">
        <img class="profile-avatar"
             th:src="${#strings.isEmpty(user.avatarImageUrl)
                      ? '/images/avatar.png'
                      : user.avatarImageUrl}"
             alt="プロフィール画像">
        <p class="profile-name"
           th:text="${user.name}">
          ユーザー名
        </p>
      </div>
      <div class="profile-content">
        <h1 class="profile-title">
          自己紹介
        </h1>
        <div class="profile-title-line"></div>
        <p class="profile-introduction"
           th:text="${user.introduction}">
        </p>
        <a class="profile-edit-button"
           th:href="@{/profile/edit}">
          自己紹介を編集する
        </a>
      </div>
    </section>
    <section class="learning-chart">
      <div class="learning-chart-header">
        <div class="learning-chart-title-area">
          <h2 class="learning-chart-title">
            学習チャート
          </h2>
          <div class="learning-chart-title-line"></div>
        </div>
        <a class="learning-chart-edit-button"
          th:href="@{/skill/edit}">
          編集する
        </a>
      </div>
      <div class="learning-chart-container">
        <canvas id="learningChart"></canvas>
      </div>
    </section>
  </main>

  <div th:replace="~{fragments/footer :: footer}"></div>

  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <script th:inline="javascript">
    const chartMonths = /*[[${chartMonths}]]*/ [];
    const chartData = /*[[${chartData}]]*/ {};

    const ctx = document.getElementById("learningChart");

    new Chart(ctx, {
      type: "bar",
      data: {
        labels: chartMonths,
        datasets: [
          {
            label: "バックエンド",
            data: chartData["バックエンド"] || [],
            backgroundColor: "rgba(255, 192, 203, 0.6)"
          },
          {
            label: "フロントエンド",
            data: chartData["フロントエンド"] || [],
            backgroundColor: "rgba(255, 218, 185, 0.6)"
          },
          {
            label: "インフラ",
            data: chartData["インフラ"] || [],
            backgroundColor: "rgba(255, 250, 205, 0.6)"
          }
        ]
      },
      options: {
          responsive: true,
          maintainAspectRatio: false,

          scales: {
              x: {
                  ticks: {
                      font: {
                          family: "Roboto",
                          size: 14,
                          weight: "400",
                          lineHeight: 20 / 14
                      },
                      color: "#000000"
                  }
              },
              y: {
                  beginAtZero: true,
                  suggestedMax: 100,
                  ticks: {
                      font: {
                          family: "Roboto",
                          size: 12,
                          weight: "400"
                      },
                      color: "#000000"
                  }
              }
          },

          plugins: {
              title: {
                  display: true,
                  text: "Chart.js Bar Chart",
                  font: {
                      family: "Roboto",
                      size: 12,
                      weight: "bold"
                  },
                  color: "#000000",
                  padding: {
                      top: 10,
                      bottom: 8
                  }
              },
              legend: {
                  display: true,
                  position: "top",
                  labels: {
                      font: {
                          family: "Roboto",
                          size: 12,
                          weight: "400"
                      },
                      color: "#000000"
                  }
              }
          }
      }
    });
  </script>
</body>
</html>
