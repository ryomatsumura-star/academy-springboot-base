<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>新規登録</title>
  <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>

  <div th:replace="~{fragments/header :: header}"></div>

  <main>
    <div layout:fragment="content">
      <h1 class="register-title">新規登録</h1>

      <div th:if="${errorMessage}" class="error-message">
        <p th:text="${errorMessage}"></p>
      </div>

      <form class="register-form"
            th:action="@{/register}"
            th:object="${registerRequest}"
            method="post">
        <div class="form-group">
          <label for="name">氏名</label>
          <input type="text" id="username" th:field="*{name}">
          <p th:if="${#fields.hasErrors('name')}" th:errors="*{name}" class="field-error"></p>
        </div>

        <div class="form-group">
          <label for="email">メールアドレス</label>
          <input type="email" id="email" th:field="*{email}">
          <p th:if="${#fields.hasErrors('email')}" th:errors="*{email}" class="field-error"></p>
        </div>

        <div class="form-group">
          <label for="password">パスワード</label>
          <input type="password" id="password" th:field="*{password}">
          <p th:if="${#fields.hasErrors('password')}" th:errors="*{password}" class="field-error"></p>
        </div>

        <button class="register-button" type="submit">登録</button>
      </form>
    </div>
  </main>

  <div th:replace="~{fragments/footer :: footer}"></div>

</body>
</html>
